# Собирает неподписанный .ipa меню для iPad (ставится через AltStore / 3uTools,
# они сами подписывают его учётной записью Apple).
# Запуск: автоматически при изменениях в android-app/ или вручную во вкладке Actions.
name: iPad IPA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'android-app/**'
      - '.github/workflows/ios-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Copy menu into iOS project
        run: npx cap sync ios

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          # Apple отклоняет Ş в основном имени при регистрации App ID, поэтому Ş только в локализации
          for l in en ru; do
            mkdir -p "Payload/App.app/$l.lproj"
            echo '"CFBundleDisplayName" = "HOŞ Lounge";' > "Payload/App.app/$l.lproj/InfoPlist.strings"
            plutil -lint "Payload/App.app/$l.lproj/InfoPlist.strings"
          done
          zip -qr hoslounge-menu-ipad.ipa Payload
          ls -lh hoslounge-menu-ipad.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: hoslounge-menu-ipad
          path: android-app/hoslounge-menu-ipad.ipa
          retention-days: 30
